[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-pingouin"
version = "0.1.0"
description = "Pingouin-compatible statistical tests and effect sizes accelerated by Mojo"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "mpmath"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
